name: Update Parking Data

on:
  schedule:
    # Every 5 minutes — realtime parking availability from TD + NMOSPIOT
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-parking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest parking data
        run: python update_parking_data.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add parking-data.json
            git commit -m "chore: auto-update parking data"
            git push origin main
            echo "Pushed data update"
          else
            echo "No data change"
          fi
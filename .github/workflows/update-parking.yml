name: Update Parking Data

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch & update parking data
        run: python update_parking_data.py

      - name: Build web app (sync to www/)
        run: |
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add www/ parking-data.json
          git diff --cached --quiet || git commit -m "chore: sync web assets to www/ [skip ci]"

      - name: Push www/ update
        run: git push
